services:
  redis:
    image: redis:8.2-bookworm
    container_name: nil-redis
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    ports:
      - 6380:6379
    volumes:
      - ./out:/data
      - ./conf:/usr/local/etc/redis/
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "admin", "--pass", "admin", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
